apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: gpu-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["nvidia.com/gpu", "cpu", "memory"]
      flavors:
        - name: gpu-a10g
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "2"
            - name: cpu
              nominalQuota: "16"
            - name: memory
              nominalQuota: "48Gi"
