apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen3-5-4b-vllm
  namespace: llm
spec:
  model:
    uri: hf://Qwen/Qwen3.5-4B
    name: Qwen/Qwen3.5-4B
  replicas: 1

  template:
    containers:
      - name: main
        image: vllm/vllm-openai:latest
        securityContext:
          runAsNonRoot: false
        args:
          - "--dtype"
          - "bfloat16"
          - "--max-model-len"
          - "8192"
          - "--gpu-memory-utilization"
          - "0.90"
          - "--port"
          - "8001"
        resources:
          requests:
            nvidia.com/gpu: "1"
            cpu: "1"
            memory: "8Gi"
            # Backed by the node's local NVMe (see gpu_node_use_instance_store in Terraform).
            # Covers the downloaded weights at /mnt/models plus the caches below.
            ephemeral-storage: "50Gi"
          limits:
            nvidia.com/gpu: "1"
            cpu: "1"
            memory: "8Gi"
            ephemeral-storage: "150Gi"
        volumeMounts:
          - name: cache
            mountPath: /root/.cache
          - name: shm
            mountPath: /dev/shm

    volumes:
      # HF / torch.compile caches on node ephemeral storage rather than the container
      # writable layer, so they are sized and reclaimed explicitly.
      - name: cache
        emptyDir:
          sizeLimit: 50Gi
      # vLLM needs more shared memory than the 64Mi default.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi

    nodeSelector:
      workload: gpu

    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

  router:
    gateway: {}
    route: {}
    scheduler: {}
